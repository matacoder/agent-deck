name: Unit tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify generated panel
        run: python3 scripts/build-panel.py --check
      - name: Install pinned encryption components (checks the lock and SHA-256 pins)
        run: python3 -m integrations.dependencies
      - name: Python unit tests
        env:
          AGENT_DECK_REQUIRE_CRYPTO: '1'
        run: python3 scripts/test-unit.py

  windows-installer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Windows installer helpers (pwsh)
        run: pwsh -NoProfile -File tests/windows/install-windows.tests.ps1

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Jest frontend unit tests
        run: npm test
