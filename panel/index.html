<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Claude">
<meta name="theme-color" content="#1e1e1e">
<link rel="apple-touch-icon" href="/icon-180.png"><link rel="icon" href="/icon-192.png"><link rel="manifest" href="/manifest.webmanifest">
<title>Claude Sessions</title>
<style>
:root{
  --bg:#1e1e1e;--side:#252526;--side2:#2d2d30;--sel:#37373d;--bd:#333336;--fg:#d4d4d4;--fg2:#ececec;--mut:#8a8a8e;--dim:#5f5f63;
  --acc:#0a84ff;--ok:#32d74b;--warn:#ffd60a;--bad:#ff453a;--orange:#e07a55;
  --mono:ui-monospace,"SF Mono",Menlo,Monaco,Consolas,monospace;
  --sat:env(safe-area-inset-top);--sab:env(safe-area-inset-bottom);--app-h:100dvh;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:13px/1.35 -apple-system,BlinkMacSystemFont,system-ui,sans-serif;overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,textarea{font:inherit}
#app{display:flex;height:var(--app-h)}

/* ---------- sidebar ---------- */
aside{width:240px;flex:none;background:var(--side);border-right:1px solid var(--bd);display:flex;flex-direction:column;min-height:0}
.side-top{display:flex;gap:6px;padding:10px 8px 8px}
.search{flex:1;min-width:0;background:var(--bg);border:1px solid var(--bd);border-radius:7px;color:var(--fg);padding:6px 9px;outline:none}
.search:focus{border-color:var(--acc)}
.iconbtn{min-width:30px;height:30px;border-radius:7px;display:inline-grid;place-items:center;color:var(--mut);font-size:16px;flex:none}
.iconbtn:hover{background:var(--side2);color:var(--fg)}
#tabs{flex:1;overflow-y:auto;padding:0 6px 12px;-webkit-overflow-scrolling:touch}
.grp{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);padding:12px 8px 4px}
.tab{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:7px;cursor:pointer;position:relative;user-select:none}
.tab:hover{background:var(--side2)}
.tab.on{background:var(--sel)}
.tab.on::before{content:"";position:absolute;left:-6px;top:7px;bottom:7px;width:3px;border-radius:2px;background:var(--acc)}
.tab .t{flex:1;min-width:0}
.tab .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--fg2)}
.tab .s{font-size:11px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab .k{font:10.5px var(--mono);color:var(--dim)}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--dim)}
.dot.idle{background:var(--ok)}
.dot.busy{background:var(--warn);animation:pulse 1s ease-in-out infinite}
.dot.off{background:transparent;border:1.5px solid var(--dim)}
@keyframes pulse{50%{opacity:.35}}
.bell{width:8px;height:8px;border-radius:50%;background:var(--acc);flex:none}
.ag{font:600 11px var(--mono);width:16px;text-align:center;flex:none}
.ag.claude{color:var(--orange)}.ag.codex{color:#5ac8c8}.ag.shell{color:var(--mut)}
.dot.sh{background:var(--dim)}
#srv{display:flex;align-items:center;gap:6px;padding:10px 12px 0;font-size:11.5px;color:var(--mut);white-space:nowrap;overflow:hidden;cursor:default}
#srv .fl{font-size:14px;line-height:1}#srv .ip{font-family:var(--mono);color:var(--fg)}#srv .hn{overflow:hidden;text-overflow:ellipsis}
.iblk{border-bottom:1px solid var(--bd)}.iblk:last-child{border-bottom:0}.iblk .irow{border-bottom:0}
.usage{padding:0 10px 8px 34px;display:grid;gap:5px}
.uw{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:7px;font-size:11px;color:var(--mut)}
.uw .bar{height:5px;border-radius:3px;background:var(--side2);overflow:hidden;position:relative}
.uw .bar b{position:absolute;top:-2px;bottom:-2px;width:2px;margin-left:-1px;background:var(--fg);opacity:.75;border-radius:1px}
.uw .pace{grid-column:1/-1;font-size:10.5px;margin-top:-3px}
.uw .pace.good{color:var(--ok)}.uw .pace.over{color:var(--warn)}.uw .pace.crit{color:var(--bad)}
.uw .bar i{display:block;height:100%;border-radius:3px;background:var(--acc)}
.uw .bar i.warn{background:var(--warn)}.uw .bar i.bad{background:var(--bad)}
.uw .pc{font-family:var(--mono);color:var(--fg);min-width:30px;text-align:right}
.uw .rs{grid-column:1/-1;font-size:10.5px;color:var(--dim);margin-top:-3px}
.usage .err{font-size:11px;color:var(--dim)}
#integ{margin:0 8px 8px;border:1px solid var(--bd);border-radius:8px;overflow:hidden}
.irow{display:flex;align-items:center;gap:8px;padding:7px 10px;border-bottom:1px solid var(--bd)}
.irow:last-child{border-bottom:0}
.irow .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--fg)}
.irow .nm small{color:var(--dim);margin-left:4px}
.irow .ok{color:var(--ok);font-size:11px}
.irow button{font-size:11.5px;padding:3px 8px;border-radius:6px;background:var(--side2);color:var(--fg);white-space:nowrap}
.irow button.go{background:var(--acc);color:#fff}
.irow button.ic{background:none;color:var(--mut);padding:3px 4px}.irow button.ic:hover{color:var(--fg)}
.agsel{display:flex;background:var(--bg);border:1px solid var(--bd);border-radius:9px;padding:3px;gap:3px;margin-bottom:14px}
.agsel button{flex:1;padding:7px 6px;border-radius:7px;color:var(--mut);display:flex;align-items:center;justify-content:center;gap:6px}
.agsel button.on{background:var(--sel);color:var(--fg2)}
.side-gh{display:flex;align-items:center;gap:8px;margin:0 8px 8px;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;color:var(--fg);text-align:left}
.side-gh:hover{background:var(--side2)}.side-gh.need{border-color:var(--acc);color:var(--acc)}
.side-gh svg{flex:none}.side-gh span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-foot{border-top:1px solid var(--bd);padding:8px 12px;color:var(--dim);font-size:11px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.side-foot button{color:var(--mut);font-size:11px}.side-foot button:hover{color:var(--fg)}

/* ---------- main ---------- */
main{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg)}
.bar{flex:none;display:flex;align-items:center;gap:4px;padding:0 6px 0 10px;height:36px;border-bottom:1px solid var(--bd);background:var(--side)}
.m-only{display:none!important}
#title{flex:1;min-width:0;text-align:center;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#title b{color:var(--fg2);font-weight:500}
#title .st{display:none}
.bar .act{height:26px;padding:0 8px;border-radius:6px;color:var(--mut);font-size:12.5px;white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.bar .act:hover{background:var(--side2);color:var(--fg)}
.bar .act.dng:hover{color:var(--bad)}
#stage{flex:1;position:relative;min-height:0}
#stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:var(--bg)}
#stage iframe.on{display:block}
#empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--dim);text-align:center;padding:20px;line-height:1.6}

/* screen view (preview + composer) */
#screen{position:absolute;inset:0;display:none;flex-direction:column}
#screen.on{display:flex}
#pre{flex:1;overflow:auto;padding:10px 12px;font:12px/1.4 var(--mono);color:var(--fg);white-space:pre-wrap;word-break:break-word;-webkit-overflow-scrolling:touch}
#pre .ln{min-height:1.4em}
#pre .hr{height:1px;background:var(--bd);margin:.65em 0}
#pre a{color:#4da3ff;text-decoration:underline;word-break:break-all}
.composer{flex:none;border-top:1px solid var(--bd);background:var(--side);padding:8px 8px calc(8px + var(--sab))}
.keys{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
.keys::-webkit-scrollbar{display:none}
.key{flex:none;background:var(--side2);border:1px solid var(--bd);border-radius:8px;min-width:38px;height:32px;padding:0 10px;font:12.5px var(--mono);color:var(--fg)}
.key:active{background:var(--sel)}
.key.num{color:var(--orange)}
.inrow{display:flex;gap:8px;align-items:flex-end}
#msg{flex:1;min-height:40px;max-height:160px;resize:none;background:var(--bg);border:1px solid var(--bd);border-radius:20px;color:var(--fg2);font-size:15px;line-height:1.35;padding:10px 14px;outline:none}
#msg:focus{border-color:var(--acc)}
.sendbtn{width:40px;height:40px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;flex:none}
.sendbtn:active{opacity:.8}

/* toast */
#toast.info{background:#1d2a3a;color:#cfe3ff;border-color:#2c4a6e}
#toast button{margin-left:12px;padding:5px 12px;border-radius:7px;background:var(--acc);color:#fff;font-weight:600}
#toast{position:fixed;left:50%;bottom:calc(20px + var(--sab));transform:translateX(-50%);background:#3a1d1d;color:#ffb4ae;border:1px solid #6b2a26;padding:9px 14px;border-radius:10px;display:none;z-index:60;max-width:calc(100vw - 32px)}

/* action sheet (mobile ⋯) */
#sheet{position:fixed;inset:0;z-index:40;display:none}
#sheet.on{display:block}
#sheet .scrim{position:absolute;inset:0;background:rgba(0,0,0,.5)}
#sheet .panel{position:absolute;left:8px;right:8px;bottom:calc(8px + var(--sab));background:var(--side);border:1px solid var(--bd);border-radius:14px;overflow:hidden}
#sheet .panel button{display:flex;width:100%;align-items:center;gap:12px;padding:15px 18px;font-size:16px;color:var(--fg2);border-bottom:1px solid var(--bd);text-align:left}
#sheet .panel button:last-child{border-bottom:0}
#sheet .panel button.dng{color:var(--bad)}
#sheet .panel button .i{width:22px;text-align:center;color:var(--mut)}
#sheet .cap{padding:12px 18px;font-size:12px;color:var(--mut);border-bottom:1px solid var(--bd)}

/* new-session dialog */
dialog{background:var(--side);color:var(--fg);border:1px solid var(--bd);border-radius:12px;padding:0;width:min(460px,calc(100vw - 32px));max-height:calc(100dvh - 40px)}
dialog::backdrop{background:rgba(0,0,0,.55)}
.dlg{display:flex;flex-direction:column;max-height:calc(100dvh - 40px)}
.dlg-body{padding:18px 18px 4px;overflow-y:auto}
.dlg h3{margin:0 0 14px;font-size:15px;font-weight:600;color:var(--fg2)}
.dlg label{display:block;font-size:11.5px;color:var(--mut);margin:12px 0 5px}
.dlg input[type=text]{width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:7px;color:var(--fg2);padding:8px 10px;outline:none}
.dlg input[type=text]:focus{border-color:var(--acc)}
.chk{display:flex;align-items:center;gap:9px;color:var(--fg);margin-top:14px;cursor:pointer}
.chk input{width:17px;height:17px;accent-color:var(--acc)}
.acts{display:flex;justify-content:flex-end;gap:8px;padding:14px 18px;border-top:1px solid var(--bd)}
.acts button{padding:8px 16px;border-radius:7px;background:var(--side2)}
.acts button.pri{background:var(--acc);color:#fff;font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two label{margin-top:0}
.gh{border:1px solid var(--bd);border-radius:9px;padding:9px;margin-bottom:6px}
.gh-head{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--mut)}
.gh-head button{color:var(--acc);font-size:12px}
.gh .search{width:100%;margin-top:8px;padding:8px 10px}
#gh_list{max-height:220px;overflow-y:auto;margin-top:6px}
.repo{padding:7px 8px;border-radius:7px;cursor:pointer;display:flex;gap:8px;align-items:baseline}
.repo:hover{background:var(--side2)}.repo.sel{background:var(--sel);box-shadow:inset 3px 0 0 var(--acc)}
.repo .rn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0;color:var(--fg2)}
.repo .rm{font-size:11px;color:var(--dim);white-space:nowrap}
.lock{font-size:10px}
.ghbtn{margin-top:8px;padding:8px 12px;border-radius:7px;background:var(--acc);color:#fff;font-weight:600}

/* ---------- mobile ---------- */
@media (max-width:760px){
  body{font-size:15px}
  .m-only{display:inline-grid!important}.d-only{display:none!important}
  aside{position:fixed;top:0;bottom:0;left:0;width:min(340px,88vw);height:var(--app-h);z-index:30;transform:translateX(-102%);transition:transform .22s ease;box-shadow:0 0 40px rgba(0,0,0,.6);padding-top:var(--sat)}
  body.drawer aside{transform:none}
  #scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20}
  body.drawer #scrim{display:block}
  .side-top{padding:12px 12px 8px}
  .search{font-size:16px;padding:9px 12px;border-radius:10px}
  .iconbtn{min-width:40px;height:40px;font-size:22px;border-radius:10px}
  #tabs{padding:0 8px 12px}
  .grp{font-size:11.5px;padding:16px 10px 6px}
  .tab{padding:11px 10px;gap:12px;border-radius:10px}
  .tab .n{font-size:16px}.tab .s{font-size:12.5px}
  .tab .k{display:none}
  .dot{width:10px;height:10px}
  .side-gh{margin:0 12px 10px;padding:12px;font-size:15px;border-radius:10px}
  #integ{margin:0 12px 10px;border-radius:10px}
  #srv{font-size:13px;padding:12px 14px 0}#srv .fl{font-size:16px}
  .usage{padding:0 12px 10px 40px;gap:7px}.uw{font-size:12.5px}.uw .rs,.uw .pace{font-size:12px}.uw .bar{height:6px}
  .irow{padding:10px 12px;gap:10px}.irow .nm{font-size:15px}
  .irow button{font-size:13.5px;padding:7px 11px;border-radius:8px}
  .agsel button{padding:10px 6px;font-size:15px}
  .ag{font-size:13px;width:18px}
  .side-foot{padding:10px 14px calc(10px + var(--sab));font-size:12.5px}
  .side-foot button{font-size:13px}

  .bar{height:calc(52px + var(--sat));padding:var(--sat) 6px 0 4px;gap:2px}
  .bar .iconbtn{min-width:44px;height:44px;font-size:21px;color:var(--fg)}
  #title{text-align:left;padding-left:4px;line-height:1.2}
  #title b{font-size:16.5px;font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis}
  #title .st{display:block;font-size:12px;color:var(--mut);overflow:hidden;text-overflow:ellipsis}
  #title .path{display:none}
  .seg{display:flex!important;background:var(--bg);border:1px solid var(--bd);border-radius:9px;padding:2px;margin-right:2px}
  .seg button{padding:6px 10px;border-radius:7px;font-size:13px;color:var(--mut)}
  .seg button.on{background:var(--sel);color:var(--fg2)}
  #menuBadge{position:absolute;top:7px;right:7px;min-width:16px;height:16px;border-radius:8px;background:var(--acc);color:#fff;font-size:10.5px;font-weight:700;display:none;place-items:center;padding:0 4px}
  #menuBadge.on{display:grid}

  #pre{font-size:12.5px;padding:12px 12px}
  #msg{font-size:16px}
  .key{height:36px;min-width:44px;font-size:14px;border-radius:9px}

  dialog{width:100vw;max-width:100vw;height:var(--app-h);max-height:none;margin:0;border-radius:0;border:0}
  .dlg{height:100%;max-height:none;padding-top:var(--sat)}
  .dlg-body{flex:1}
  .dlg h3{font-size:18px}
  .dlg input[type=text],.gh .search{font-size:16px;padding:11px 12px;border-radius:10px}
  .two{grid-template-columns:1fr}
  .two>div+div label{margin-top:12px}
  .repo{padding:11px 10px}
  #gh_list{max-height:38vh}
  .acts{padding:12px 16px calc(12px + var(--sab))}
  .acts button{flex:1;padding:13px;font-size:16px;border-radius:10px}
  .chk{font-size:15px}
}
.seg{display:none}
body.is-shell .agent-only{display:none!important}
</style></head><body>
<div id="app">
  <aside>
    <div id="srv"></div>
    <div class="side-top">
      <input id="q" class="search" placeholder="Поиск…" autocomplete="off" autocapitalize="off" spellcheck="false">
      <button class="iconbtn" title="Новая сессия (⌥T)" onclick="openNew()">＋</button>
    </div>
    <div id="tabs"></div>
    <div id="integ"></div>
    <div class="side-foot"><span id="foot"></span><button onclick="logout()">Выйти</button></div>
  </aside>
  <div id="scrim" onclick="drawer(false)"></div>
  <main>
    <div class="bar">
      <button class="iconbtn m-only" style="position:relative" onclick="drawer(true)" aria-label="Сессии">☰<span id="menuBadge"></span></button>
      <div id="title">—</div>
      <div class="seg" id="seg"><button data-m="screen" onclick="setMode('screen')">Экран</button><button data-m="term" onclick="setMode('term')">Терм</button></div>
      <button class="act d-only" id="b_link" title="Открыть последнюю ссылку из терминала" onclick="openLink()" style="display:none">🔗 Ссылка</button>
      <button class="act d-only" id="b_mode" title="Терминал / экран с полем ввода" onclick="setMode(curMode()==='term'?'screen':'term')">⌨ Экран</button>
      <button class="act d-only" title="Открыть обычный терминал в папке этой сессии" onclick="termHere()">&gt;_ Терминал здесь</button>
      <button class="act d-only agent-only" title="Перезапустить агента, продолжив разговор" onclick="restart('continue')">↻ Продолжить</button>
      <button class="act d-only agent-only" title="Перезапустить агента с новым разговором" onclick="restart('new')">✚ Новый</button>
      <button class="act d-only" title="Открыть терминал в новой вкладке" onclick="popout()">↗</button>
      <button class="act dng d-only" title="Закрыть сессию" onclick="kill()">✕</button>
      <button class="iconbtn m-only" onclick="sheet(true)" aria-label="Действия">⋯</button>
    </div>
    <div id="stage">
      <div id="empty">Выберите сессию слева<br>или создайте новую: ＋</div>
      <div id="screen">
        <div id="pre"></div>
        <div class="composer">
          <div class="keys">
            <button class="key num" onclick="key('1')">1</button><button class="key num" onclick="key('2')">2</button><button class="key num" onclick="key('3')">3</button>
            <button class="key" onclick="key('Escape')">Esc</button><button class="key" onclick="key('Up')">↑</button><button class="key" onclick="key('Down')">↓</button>
            <button class="key" onclick="key('Enter')">⏎</button><button class="key" onclick="key('BTab')">⇧Tab</button><button class="key" onclick="key('Tab')">Tab</button>
            <button class="key" onclick="key('C-c')">^C</button>
          </div>
          <div class="inrow">
            <textarea id="msg" rows="1" placeholder="Сообщение в Claude…" enterkeyhint="send"></textarea>
            <button class="sendbtn" onclick="send()" aria-label="Отправить"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<div id="sheet"><div class="scrim" onclick="sheet(false)"></div><div class="panel">
  <div class="cap" id="sheetCap"></div>
  <button id="s_link" onclick="sheet(false);openLink()"><span class="i">🔗</span>Открыть ссылку из терминала</button>
  <button onclick="sheet(false);termHere()"><span class="i">&gt;_</span>Терминал в этой папке</button>
  <button class="agent-only" onclick="sheet(false);restart('continue')"><span class="i">↻</span>Перезапустить, продолжив разговор</button>
  <button class="agent-only" onclick="sheet(false);restart('new')"><span class="i">✚</span>Перезапустить с новым разговором</button>
  <button onclick="sheet(false);popout()"><span class="i">↗</span>Терминал в новой вкладке</button>
  <button class="dng" onclick="sheet(false);kill()"><span class="i">✕</span>Закрыть сессию</button>
  <button onclick="sheet(false)"><span class="i"></span>Отмена</button>
</div></div>
<div id="toast"></div>

<dialog id="dlg"><form class="dlg" method="dialog" onsubmit="event.preventDefault();createSession()">
  <div class="dlg-body">
    <h3>Новая сессия</h3>
    <div class="agsel" id="agsel">
      <button type="button" data-a="claude" class="on" onclick="pickAgent('claude')"><span class="ag claude">✻</span>Claude</button>
      <button type="button" data-a="codex" onclick="pickAgent('codex')"><span class="ag codex">◎</span>Codex</button>
      <button type="button" data-a="shell" onclick="pickAgent('shell')"><span class="ag shell">$</span>Терминал</button>
    </div>
    <div class="gh" id="gh">

<script>
const $=id=>document.getElementById(id);
const BUSY_SEC=6;
const isMobile=()=>matchMedia("(max-width:760px)").matches;
let sessions=[],active=null,mode=null,clockSkew=0;
const frames=new Map(),wasBusy=new Map(),attention=new Set();
try{active=localStorage.getItem("cc.active");mode=localStorage.getItem("cc.mode."+(isMobile()?"m":"d"))}catch(e){}
if(location.hash.length>1)active=decodeURIComponent(location.hash.slice(1));

/* keep layout glued to the visible area when the iOS keyboard opens */
function fitViewport(){const vv=window.visualViewport;if(vv){document.documentElement.style.setProperty("--app-h",vv.height+"px");window.scrollTo(0,0)}}
if(window.visualViewport){visualViewport.addEventListener("resize",fitViewport);visualViewport.addEventListener("scroll",fitViewport);fitViewport()}

async function api(path,body){
  const r=await fetch(path,body?{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}:{cache:"no-store"});
  if(r.status===401){location.href="/login";throw new Error("login required")}
  const d=r.headers.get("Date");if(d)clockSkew=Date.now()/1000-Date.parse(d)/1000;
  const j=await r.json().catch(()=>({error:r.statusText}));
  if(!r.ok)throw new Error(j.error||r.statusText);return j;
}
function toast(m,info,action){
  const t=$("toast");t.className=info?"info":"";t.replaceChildren(m);
  if(action){const b=document.createElement("button");b.textContent=action.label;b.onclick=()=>{action.run();t.style.display="none"};t.append(b)}
  t.style.display="block";clearTimeout(t._h);t._h=setTimeout(()=>t.style.display="none",action?12000:(info?1800:5000));
}

/* tmux (set-clipboard on) sends selections as OSC 52 -> put them on the browser clipboard.
   Over plain HTTP there is no Clipboard API, so copy via execCommand right after the mouse-up
   (still inside the user activation window); if the browser refuses, offer a button. */
function execCopy(text,doc){
  const ta=doc.createElement("textarea");ta.value=text;ta.setAttribute("readonly","");
  ta.style.cssText="position:fixed;top:-1000px;left:0;opacity:0";doc.body.appendChild(ta);ta.select();
  let ok=false;try{ok=doc.execCommand("copy")}catch(e){}
  ta.remove();return ok;
}
async function copyToClipboard(text,w){
  const done=()=>toast(`Скопировано: ${text.length} симв.`,true);
  try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(text);return done()}}catch(e){}
  const ok=execCopy(text,w.document);
  try{w.term.focus()}catch(e){}
  if(ok)return done();
  toast("Выделение из терминала готово",true,{label:"Копировать",run:()=>{execCopy(text,document)?done():toast("Браузер запретил копирование")}});
}
function hookClipboard(w,tries=0){
  const t=w.term;
  if(!t||!t.parser){if(tries<100)setTimeout(()=>hookClipboard(w,tries+1),100);return}
  if(t._ccClip)return;t._ccClip=true;
  t.parser.registerOscHandler(52,data=>{
    const b64=data.slice(data.indexOf(";")+1);
    if(!b64||b64==="?")return true;
    try{copyToClipboard(new TextDecoder().decode(Uint8Array.from(atob(b64),c=>c.charCodeAt(0))),w)}catch(e){}
    return true;
  });
}
const now=()=>Date.now()/1000-clockSkew;
const AGENTS={claude:{label:"Claude",glyph:"✻",skip:"--dangerously-skip-permissions"},
  codex:{label:"Codex",glyph:"◎",skip:"--dangerously-bypass-approvals-and-sandbox"},
  shell:{label:"Терминал",glyph:"$"}};
const agentOf=s=>AGENTS[s&&s.agent]?s.agent:"claude";
const state=s=>{
  const recent=now()-s.activity<BUSY_SEC;
  if(agentOf(s)==="shell")return recent?"busy":"sh";
  return !s.running?"off":(recent?"busy":"idle");
};
function stateText(s){
  const a=AGENTS[agentOf(s)].label,st=state(s);
  if(agentOf(s)==="shell")return st==="busy"?"терминал · вывод…":(s.running?"терминал · "+s.command:"терминал");
  return {off:a+" не запущен",busy:a+" работает…",idle:a+" ждёт"}[st];
}
function el(tag,cls,...kids){const e=document.createElement(tag);if(cls)e.className=cls;e.append(...kids);return e}
const shortPath=p=>p.replace(/^.*\/projects\//,"~/").replace(/\.worktrees\//,"⎇ ");
const curMode=()=>mode||(isMobile()?"screen":"term");

function drawer(on){document.body.classList.toggle("drawer",on);if(on)$("q").blur()}
function sheet(on){
  if(on){if(!active)return;$("sheetCap").textContent=active;$("s_link").style.display=lastUrl(cur())?"":"none"}
  $("sheet").classList.toggle("on",on);
}
const cur=()=>sessions.find(x=>x.name===active);

function renderTabs(){
  const q=$("q").value.trim().toLowerCase(),box=$("tabs");
  const list=sessions.filter(s=>!q||(s.name+" "+s.group+" "+s.path).toLowerCase().includes(q));
  box.replaceChildren();let grp=null,i=0;
  for(const s of list){
    if(s.group!==grp){grp=s.group;box.append(el("div","grp",grp))}
    i++;const st=state(s);
    const t=el("div","tab"+(s.name===active?" on":""));
    const dot=el("span","dot "+st);dot.title=stateText(s);
    const ag=agentOf(s);
    t.append(dot,el("span","ag "+ag,AGENTS[ag].glyph),el("div","t",el("div","n",s.name),el("div","s",shortPath(s.path))));
    if(attention.has(s.name))t.append(el("span","bell"));
    else if(i<10)t.append(el("span","k","⌥"+i));
    t.onclick=()=>select(s.name);
    box.append(t);
  }
  if(!sessions.length)box.append(el("div","grp","сессий пока нет"));
  const busy=sessions.filter(s=>state(s)==="busy").length;
  $("foot").textContent=`${sessions.length} сессий · ${busy} работают`+(attention.size?` · ${attention.size} готово`:"");
  $("menuBadge").textContent=attention.size;$("menuBadge").classList.toggle("on",attention.size>0);
  document.title=(attention.size?`(${attention.size}) `:"")+"Claude Sessions";
}
function renderTitle(){
  const s=cur(),t=$("title");t.replaceChildren();
  document.body.classList.toggle("is-shell",!!s&&agentOf(s)==="shell");
  if(!s){t.textContent=isMobile()?"Claude":"—";return}
  const st=state(s);
  t.append(el("b","",s.name),el("span","path"," — "+s.path.replace(/^\/home\/[^/]+/,"~")),el("span","st",stateText(s)+" · "+shortPath(s.path)));
}

function frameFor(name){
  let f=frames.get(name);
  if(!f){
    f=document.createElement("iframe");f.src="/t/?arg="+encodeURIComponent("cc-"+name);
    f.onload=()=>{try{f.contentWindow.addEventListener("keydown",hotkeys,true);hookClipboard(f.contentWindow)}catch(e){}};
    $("stage").append(f);frames.set(name,f);
  }
  return f;
}
function show(){
  const s=cur(),m=curMode();
  $("empty").style.display=s?"none":"grid";
  renderTitle();
  $("b_mode").textContent=m==="term"?"⌨ Экран":"▣ Терминал";
  for(const b of $("seg").children)b.classList.toggle("on",b.dataset.m===m);
  for(const[n,f]of frames)f.classList.toggle("on",!!s&&m==="term"&&n===active);
  $("screen").classList.toggle("on",!!s&&m==="screen");
  if(s&&m==="term"){const f=frameFor(active);f.classList.add("on");if(!isMobile())setTimeout(()=>{try{f.contentWindow.focus();f.contentWindow.term&&f.contentWindow.term.focus()}catch(e){}},30)}
  if(s&&m==="screen")updateScreen(s,true);
  updateLink();
}
function setMode(m){mode=m;try{localStorage.setItem("cc.mode."+(isMobile()?"m":"d"),m)}catch(e){}show()}

const URL_RE=/https?:\/\/[^\s"'<>│]+/g;
const BOX_LINE=/^[\s─━═╌┄┈╍▔▁-]*[─━═╌┄┈╍▔▁][\s─━═╌┄┈╍▔▁-]*$/;
/* Claude hard-wraps long URLs: glue a URL at line end with following space-free lines */
function unwrapUrls(text){
  const L=text.split("\n"),out=[];
  for(let i=0;i<L.length;i++){
    let line=L[i];
    if(/https?:\/\/\S+$/.test(line.trimEnd()))
      while(i+1<L.length&&/^\S{2,}$/.test(L[i+1])&&!/^https?:/.test(L[i+1])){line=line.trimEnd()+L[++i]}
    out.push(line);
  }
  return out.join("\n");
}
const cleanUrl=u=>u.replace(/[.,;)\]]+$/,"");
function lastUrl(s){const m=unwrapUrls(s&&s.preview||"").match(URL_RE);return m?cleanUrl(m[m.length-1]):null}
function updateLink(){$("b_link").style.display=lastUrl(cur())?"":"none"}
function openLink(){const u=lastUrl(cur());if(u)window.open(u,"_blank","noopener")}
function updateScreen(s,force){
  const p=$("pre"),stick=force||p.scrollTop+p.clientHeight>=p.scrollHeight-40,text=unwrapUrls(s.preview||"");
  if(p.dataset.raw!==text){
    p.dataset.raw=text;p.replaceChildren();
    for(const raw of text.split("\n")){
      const line=raw.replace(/\s+$/,"");
      if(line.length>=8&&BOX_LINE.test(line)){p.append(el("div","hr"));continue}
      const d=el("div","ln");let i=0;
      for(const m of line.matchAll(URL_RE)){
        const u=cleanUrl(m[0]);d.append(line.slice(i,m.index));
        const a=document.createElement("a");a.href=u;a.target="_blank";a.rel="noopener";a.textContent=u;d.append(a);i=m.index+u.length;
      }
      d.append(line.slice(i));p.append(d);
    }
  }
  if(stick)p.scrollTop=p.scrollHeight;
}
function select(name){
  active=name;attention.delete(name);
  try{localStorage.setItem("cc.active",name)}catch(e){}
  history.replaceState(null,"","#"+encodeURIComponent(name));
  drawer(false);$("pre").dataset.raw="";renderTabs();show();
}

async function load(){
  try{
    const{sessions:list}=await api("/api/sessions");
    for(const s of list){
      const busy=state(s)==="busy";
      if(wasBusy.get(s.name)&&!busy&&s.name!==active)attention.add(s.name);
      wasBusy.set(s.name,busy);
    }
    const names=new Set(list.map(s=>s.name));
    for(const[n,f]of frames)if(!names.has(n)){f.remove();frames.delete(n);attention.delete(n)}
    const first=!sessions.length&&!load.done;load.done=true;
    sessions=list;
    if(active&&!names.has(active))active=null;
    if(!active&&sessions.length&&!isMobile())active=sessions[0].name;
    if(first&&!active&&isMobile())drawer(true);
    renderTabs();renderTitle();updateLink();
    const s=cur(),m=curMode();
    if(!s||(m==="term"&&!frames.has(active)))show();
    else if(m==="screen")updateScreen(s);
  }catch(e){toast(e.message)}
}
async function post(path,body,confirmText){
  if(confirmText&&!confirm(confirmText))return false;
  try{await api(path,body);await load();return true}catch(e){toast(e.message);return false}
}
function restart(m){
  const s=cur();if(!s)return;const a=AGENTS[agentOf(s)].label;
  post("/api/restart",{name:active,mode:m},m==="new"?`Перезапустить ${a} в «${active}» с НОВЫМ разговором?`:`Перезапустить ${a} в «${active}», продолжив разговор?`);
}
async function termHere(){
  const s=cur();if(!s)return;
  const names=new Set(sessions.map(x=>x.name));
  let base=s.name.replace(/-sh\d*$/,"").slice(0,27)+"-sh",n=base,i=2;
  while(names.has(n))n=base+(i++);
  if(await post("/api/new",{name:n,agent:"shell",path:s.path}))select(n);
}
async function kill(){
  if(!active)return;const n=active;
  if(await post("/api/kill",{name:n},`Закрыть сессию «${n}»? Claude будет остановлен.`)){active=null;show()}
}
function popout(){if(active)window.open("/t/?arg="+encodeURIComponent("cc-"+active),"_blank")}
async function send(){
  const t=$("msg");if(!active||!t.value.trim())return;
  const text=t.value;t.value="";t.style.height="";
  if(!await post("/api/send",{name:active,text})){t.value=text}
  $("pre").scrollTop=$("pre").scrollHeight;
}
function key(k){if(active)post("/api/send",{name:active,key:k})}
async function logout(){await fetch("/logout",{method:"POST"});location.href="/login"}
$("msg").addEventListener("input",e=>{e.target.style.height="";e.target.style.height=Math.min(e.target.scrollHeight,160)+"px"});
$("msg").addEventListener("keydown",e=>{
  if(e.key==="Enter"&&!e.shiftKey&&(isMobile()?false:true)&&!e.isComposing){e.preventDefault();send()}
  else if(e.key==="Enter"&&(e.metaKey||e.ctrlKey)){e.preventDefault();send()}
});
$("q").addEventListener("input",renderTabs);

/* ---------- GitHub ---------- */
const GH_ICON='<svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>';
let repos=[],ghLogin=null;
async function ghStatus(){try{const st=await api("/api/github/status");ghLogin=st.connected?st.login:null}catch(e){ghLogin=null}return ghLogin}
async function ghConnect(){if(await post("/api/github_login",{})){if($("dlg").open)$("dlg").close();select("github-login");setMode("screen")}}
async function agentAction(kind,agent){
  const name=kind==="install"?"install-"+agent:agent+"-login";
  if(await post("/api/agent_"+kind,{agent})){select(name);if(isMobile())setMode("screen")}
}
function irow(glyphHtml,name,ver,right){
  const r=el("div","irow");const g=el("span","");g.innerHTML=glyphHtml;
  const nm=el("span","nm",name);if(ver)nm.append(el("small","",ver));
  r.append(g,nm,...right);return r;
}
function btn(label,cls,fn,title){const b=el("button",cls||"",label);b.onclick=fn;if(title)b.title=title;return b}
let lastGh=0,lastAg={},usageData={};
async function checkGithubFoot(force){
  try{lastAg=await api("/api/agents")}catch(e){}
  if(force===true||Date.now()-lastGh>30000||sessions.some(s=>s.name==="github-login")){await ghStatus();lastGh=Date.now()}
  renderInteg();
}
async function loadUsage(){try{usageData=await api("/api/usage")}catch(e){}renderInteg()}

function fmtReset(ts){
  if(!ts)return"";
  const ms=ts*1000-Date.now();if(ms<=0)return"сбрасывается…";
  const m=Math.round(ms/60000),d=new Date(ts*1000);
  const rel=m<60?`${m} мин`:m<1440?`${Math.floor(m/60)} ч ${m%60} мин`:`${Math.floor(m/1440)} д ${Math.floor(m%1440/60)} ч`;
  const hm=d.toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"});
  const abs=m<1440&&d.getDate()===new Date().getDate()?hm:d.toLocaleDateString("ru-RU",{weekday:"short",day:"numeric",month:"short"})+" "+hm;
  return `сброс через ${rel} · ${abs}`;
}
/* pace: compare used % with the share of the window that has already elapsed */
function pace(w){
  if(!w.resets_at||!w.secs)return null;
  const now=Date.now()/1000,left=w.resets_at-now,elapsed=Math.min(Math.max(1-left/w.secs,0),1);
  if(elapsed<0.03||left<=0)return {elapsed};             // too early to judge
  const used=w.percent||0,norm=elapsed*100,diff=Math.round(used-norm);
  const res={elapsed,norm:Math.round(norm),diff};
  if(used>0){
    const rate=used/(w.secs*elapsed);                       // % per second so far
    const hitAt=now+(100-used)/rate;                        // when 100% is reached at this pace
    res.forecast=Math.round(used/elapsed);                  // projected % at reset
    if(hitAt<w.resets_at&&elapsed>=0.1)res.hitAt=hitAt;   // early in the window the forecast is noise
  }
  return res;
}
function fmtWhen(ts){
  const d=new Date(ts*1000),hm=d.toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"});
  return d.toDateString()===new Date().toDateString()?"сегодня "+hm:d.toLocaleDateString("ru-RU",{weekday:"short"})+" "+hm;
}
function usageBlock(u){
  const box=el("div","usage");
  if(!u)return null;
  if(u.error&&!(u.windows||[]).length){box.append(el("div","err",u.error));return box}
  for(const w of u.windows||[]){
    const p=Math.round(w.percent||0),fill=el("i",p>=90?"bad":p>=70?"warn":"");fill.style.width=Math.min(p,100)+"%";
    const pc=pace(w),bar=el("span","bar",fill),row=el("div","uw",el("span","",w.label),bar,el("span","pc",p+"%"));
    if(pc&&pc.norm!==undefined){
      const tick=el("b","");tick.style.left=(pc.elapsed*100)+"%";tick.title=`норма к этому моменту: ${pc.norm}%`;bar.append(tick);
      let cls,txt;
      if(pc.diff<=0){cls="good";txt=`✓ запас ${-pc.diff}% · норма ${pc.norm}% · прогноз к сбросу ${pc.forecast??0}%`}
      else if(pc.diff<=3){cls="good";txt=`≈ в темпе · норма ${pc.norm}%`}
      else{
        cls=pc.hitAt?"crit":"over";
        txt=`▲ перерасход ${pc.diff}% · норма ${pc.norm}%`+(pc.hitAt?` · закончится ~${fmtWhen(pc.hitAt)}`:` · прогноз ${pc.forecast}%, хватит`);
      }
      row.append(el("span","pace "+cls,txt));
    }
    row.append(el("span","rs",fmtReset(w.resets_at)));
    box.append(row);
  }
  if(u.stale)box.append(el("div","err","данные могут быть устаревшими"));
  return box;
}
function renderInteg(){
  const blocks=[];
  for(const a of["claude","codex"]){
    const st=lastAg[a]||{},glyph=`<span class="ag ${a}">${AGENTS[a].glyph}</span>`,right=[];
    if(!st.installed)right.push(btn("Установить","go",()=>agentAction("install",a)));
    else{
      right.push(st.logged_in?el("span","ok","✓"):btn("Войти","go",()=>agentAction("login",a)));
      right.push(btn("⟳","ic",()=>agentAction("install",a),"Обновить официальным установщиком"));
    }
    const u=usageData[a],ver=[st.version,u&&u.plan].filter(Boolean).join(" · ");
    const blk=el("div","iblk",irow(glyph,AGENTS[a].label,ver,right));
    const ub=st.logged_in&&usageBlock(u);if(ub)blk.append(ub);
    blocks.push(blk);
  }
  blocks.push(el("div","iblk",irow(GH_ICON,ghLogin||"GitHub","",[ghLogin?btn("Репозитории","",openNew):btn("Подключить","go",ghConnect)])));
  $("integ").replaceChildren(...blocks);
}
async function loadServer(){
  try{
    const s=await api("/api/server"),box=$("srv");box.replaceChildren();
    const cc=(s.country||"").toUpperCase();
    if(/^[A-Z]{2}$/.test(cc))box.append(el("span","fl",String.fromCodePoint(...[...cc].map(c=>0x1F1A5+c.charCodeAt(0)))));
    box.append(el("span","ip",s.ip||s.tailscale_ip||"?"),el("span","hn","· "+s.hostname));
    box.title=[s.city&&`${s.city}, ${cc}`,s.org,`Tailscale: ${s.tailscale_ip}`].filter(Boolean).join("\n");
  }catch(e){}
}
async function loadGithub(){
  const body=$("gh_body");body.replaceChildren();$("gh_refresh").style.display="none";$("gh_state").textContent="GitHub: проверяю…";
  await ghStatus();
  if(!ghLogin){
    $("gh_state").textContent="GitHub не подключён";
    const b=el("button","ghbtn","Подключить GitHub");b.type="button";b.onclick=ghConnect;body.append(b);return;
  }
  $("gh_state").textContent="GitHub: "+ghLogin;$("gh_refresh").style.display="";
  const q=document.createElement("input");q.type="text";q.id="gh_q";q.className="search";q.placeholder="Поиск репозитория…";q.autocomplete="off";q.setAttribute("autocapitalize","off");
  q.oninput=renderRepos;const list=el("div","");list.id="gh_list";body.append(q,list);
  loadRepos(false);
}
async function loadRepos(refresh){
  const list=$("gh_list");if(!list)return;list.textContent="Загружаю…";
  try{repos=(await api("/api/github/repos"+(refresh?"?refresh=1":""))).repos;renderRepos()}catch(e){list.textContent=e.message}
}
function renderRepos(){
  const list=$("gh_list"),q=($("gh_q").value||"").toLowerCase();list.replaceChildren();
  const sel=$("n_git").value;
  for(const r of repos.filter(r=>!q||(r.full_name+" "+r.description).toLowerCase().includes(q)).slice(0,100)){
    const url="https://github.com/"+r.full_name+".git";
    const row=el("div","repo"+(sel===url?" sel":""),el("span","rn",r.full_name));
    if(r.private)row.append(el("span","lock","🔒"));
    row.append(el("span","rm",(r.pushed_at||"").slice(0,10)));
    row.title=r.description||"";row.onclick=()=>pickRepo(r);list.append(row);
  }
  if(!list.children.length)list.textContent="Ничего не найдено";
}
function pickRepo(r){
  const repo=r.full_name.split("/")[1];
  $("n_git").value="https://github.com/"+r.full_name+".git";$("n_proj").value=repo;
  if(!$("n_name").value||$("n_name").dataset.auto){$("n_name").value=repo.replace(/[^A-Za-z0-9_-]/g,"-").slice(0,32);$("n_name").dataset.auto="1"}
  renderRepos();
}
$("n_name").addEventListener("input",e=>delete e.target.dataset.auto);

let newAgent="claude";
function pickAgent(a){
  newAgent=a;for(const b of $("agsel").children)b.classList.toggle("on",b.dataset.a===a);
  $("n_skip_row").style.display=a==="shell"?"none":"";
  if(a!=="shell")$("n_skip_lbl").textContent="Без подтверждений ("+AGENTS[a].skip+")";
}
async function openNew(){
  drawer(false);
  try{const{projects}=await api("/api/projects");$("projlist").replaceChildren(...projects.map(p=>{const o=document.createElement("option");o.value=p;return o}))}catch(e){}
  $("dlg").showModal();loadGithub();
}
async function createSession(){
  const name=$("n_name").value.trim();$("n_go").disabled=true;$("n_go").textContent="Создаю…";
  const ok=await post("/api/new",{name,project:$("n_proj").value.trim()||name,git:$("n_git").value.trim(),
    worktree:$("n_wt").checked,branch:$("n_branch").value.trim(),skip:$("n_skip").checked,agent:newAgent});
  $("n_go").disabled=false;$("n_go").textContent="Создать";
  if(ok){$("dlg").close();for(const i of["n_name","n_proj","n_git","n_branch"])$(i).value="";select(name)}
}

/* ⌥1..9 — табы, ⌥↑/⌥↓ — пред./след., ⌥T — новая (работает и внутри терминала) */
function hotkeys(e){
  if(!e.altKey||e.ctrlKey||e.metaKey)return;
  const vis=[...$("tabs").querySelectorAll(".tab")].map(t=>t.querySelector(".n").textContent);
  let target=null;
  if(/^Digit[1-9]$/.test(e.code))target=vis[+e.code.slice(5)-1];
  else if(e.code==="ArrowUp"||e.code==="ArrowDown"){const i=vis.indexOf(active);target=vis[(i+(e.code==="ArrowUp"?-1:1)+vis.length)%vis.length]}
  else if(e.code==="KeyT"){e.preventDefault();e.stopPropagation();openNew();return}
  else return;
  e.preventDefault();e.stopPropagation();if(target)select(target);
}
addEventListener("keydown",hotkeys,true);
let lastMobile=isMobile();
addEventListener("resize",()=>{if(isMobile()!==lastMobile){lastMobile=isMobile();try{mode=localStorage.getItem("cc.mode."+(lastMobile?"m":"d"))}catch(e){mode=null}show()}});

checkGithubFoot(true);setInterval(checkGithubFoot,5000);
loadUsage();setInterval(loadUsage,60000);
loadServer();setInterval(loadServer,3600000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden){checkGithubFoot(true);loadUsage();load()}});
load();setInterval(load,2500);
